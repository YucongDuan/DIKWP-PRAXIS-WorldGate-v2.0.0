 const p=panel(tr('不知道有没有发生，就不能盲目再来一次','An unknown effect must not be blindly repeated'));table(p,[tr('任务','Job'),tr('申请量','Units'),tr('最终结算','Final state')],data.delivery.jobs.map(j=>[j.body.id,j.body.units,j.state]));note(p,'该实验有两个真实本地SQLite数据库，但没有网络或支付接口。相同的演示不构成分布式exactly-once保证。','This lab has two real local SQLite databases, but no network or payment connector. It does not establish distributed exactly-once semantics.',true);detail(p,tr('提供端效应与核对','Provider effects and reconciliation'),data.delivery);add(p,'p',tr('补偿规则：当前版本与原后状态完全相同才能恢复库存并增加版本。若另有写入，返回COMPENSATION_CONFLICT，保留后来者结果。','Compensation rule: restore stock and increment revision only when current state exactly matches the recorded poststate. A later write produces COMPENSATION_CONFLICT and is preserved.'));
}else if(tab==='monitor'){
 const p=panel(tr('序贯风险，不把“未报警”当安全证书','Sequential risk, not a safety certificate'));const select=add(p,'select');select.setAttribute('aria-label',tr('监测序列','Monitoring stream'));for(const [k,c,e] of [['adverse','异常序列','Adverse stream'],['clean','无失败序列','No-failure stream'],['delayed','第6组缺失','Missing group 6']]){const o=add(select,'option',tr(c,e));o.value=k}
 const box=add(p,'div');const draw=()=>{box.replaceChildren();const m=data.monitors[select.value];add(box,'h3',m.state);add(box,'p',tr('处理组数 / 首次触发 / 阈值：','Processed groups / first alarm / threshold: ')+m.processed_ordered_groups+' / '+(m.first_alarm_at||'—')+' / '+m.threshold);table(box,['Group','Failed','log(E)','E (capped)'],m.series.slice(0,200).map(r=>[r.sequence,r.failed,r.log_e.toFixed(3),r.e_value_capped.toFixed(3)]));detail(box,tr('前提与局限','Assumptions and limits'),{config:m.config,assumptions:m.assumptions,limits:m.limits})};select.onchange=draw;draw();
}else if(tab==='repair'){
 const p=panel(tr('有限规则修复，不是无限自我改写','Finite rule repair, not unrestricted self-modification'));table(p,[tr('严格整数','Strict integer'),tr('库存底线','Stock floor'),tr('来源不授予权限','Ignore source instructions'),tr('开发正确','Development correct')],data.repair.development.map(r=>[r.policy.strict_integer,r.policy.respect_floor,r.policy.ignore_untrusted_text,r.correct+'/'+r.total]));add(p,'p',tr('候选选定后，先消耗保留集额度，再执行36个案例。再次使用同一修复家族：','After candidate selection, holdout use is consumed before 36 evaluations. Repeat use of the same repair family: ')+data.repair.repeat_attempt);note(p,'保留集是公开合成数据；本地预算不能防止管理员删库或复制。没有自动部署、授予权限或修改答案。','The holdout is public synthetic data. Its local budget cannot stop an administrator deleting or copying the DB. No automatic deployment, grant issuance or label changes.',true);detail(p,tr('最小反例','Reduced counterexample'),data.repair.counterexample);
}else{
 const p=panel(tr('生成未签名请求草稿','Create an unsigned request draft'));note(p,'这只是格式辅助。不会检查实际库存、当前授权或签名，也不会执行任何操作。有效授权必须由Python内核核验。','Format assistance only. It does not inspect actual stock, active authority or signatures, and executes nothing. The Python kernel must validate real authorization.',true);const form=add(p,'form',null,'draft-controls');const grid=add(form,'div',null,'fields');
 const values=[['tenant','local','租户','Tenant'],['action_id','request-001','请求ID','Request ID'],['actor','executor-person','执行者','Executor'],['grant_id','grant-001','授权ID','Grant ID'],['resource','stock-a','资源','Resource'],['units','3','数量（正整数）','Units (positive integer)'],['expected_revision','0','期望版本','Expected revision'],['contract_hash','','合同SHA-256','Contract SHA-256'],['candidate_hash','','候选SHA-256','Candidate SHA-256']];const inputs={};values.forEach(([k,v,c,e])=>{const l=add(grid,'label',tr(c,e));const x=add(l,'input');x.name=k;x.value=v;x.required=true;x.maxLength=k.endsWith('hash')?64:120;inputs[k]=x});const b=add(form,'button',tr('导出草稿（不执行）','Export draft (no execution)'));b.type='submit';const preview=add(p,'pre',tr('等待填写有效字段。','Waiting for valid fields.'));
 form.onsubmit=event=>{event.preventDefault();try{const q={kind:'action',operation:'inventory.reserve'};for(const [k,x] of Object.entries(inputs)){if(['units','expected_revision'].includes(k)){if(!/^\d+$/.test(x.value))throw Error('INTEGER_RANGE');q[k]=Number(x.value);if(!Number.isSafeInteger(q[k])||q[k]<(k==='units'?1:0))throw Error('INTEGER_RANGE')}else{q[k]=x.value;if(!(k.endsWith('hash')?/^[0-9a-f]{64}$/:/^[A-Za-z0-9_.:-]{1,120}$/).test(q[k]))throw Error('FIELD_FORMAT: '+k)}}preview.textContent=JSON.stringify(q,null,2);saveJson('unsigned_request.json',q);$('error').classList.add('hidden')}catch(e){showError(e)}};
}
}
function showError(e){$('error').textContent=tr('未替换现有数据：','Current data preserved: ')+(e.message||String(e));$('error').classList.remove('hidden')}
$('lang').onclick=()=>{language=language==='cn'?'en':'cn';render()};$('export').onclick=()=>saveJson('worldgate_summary.json',data);$('reset').onclick=()=>{data=original;$('error').classList.add('hidden');render()};$('print').onclick=()=>window.print();
$('file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>8000000)throw Error('SIZE_LIMIT');const next=JSON.parse(await f.text());if(next.version!=='2.0.0'||!next.runtime||!Array.isArray(next.runtime.scenarios)||!next.delivery||!next.monitors||!next.repair)throw Error('UNSUPPORTED_SUMMARY_SCHEMA');const old=data;data=next;try{render()}catch(err){data=old;render();throw err}$('error').classList.add('hidden')}catch(err){showError(err)}finally{$('file').value=''}};
render();
</script></body></html>
